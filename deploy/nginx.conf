# Install as a NEW /etc/nginx/sites-available/clipvelto file.
# Certbot adds HTTPS after DNS points to this VPS. Existing vhosts stay intact.
server {
    listen 80;
    listen [::]:80;
    server_name www.clipvelto.com;
    return 301 https://clipvelto.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name clipvelto.com;
    client_max_body_size 2m;

    # API/auth/webhooks use one trusted proxy hop; uploads go directly to R2.
    location /api/ {
        include /etc/nginx/snippets/clipvelto-proxy.conf;
        proxy_pass http://127.0.0.1:4002;
        proxy_buffering off;
    }

    location / {
        include /etc/nginx/snippets/clipvelto-proxy.conf;
        proxy_pass http://127.0.0.1:3002;
    }
}
