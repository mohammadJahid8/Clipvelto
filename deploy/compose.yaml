name: clipvelto

x-app: &app
  image: ghcr.io/mohammadjahid8/clipvelto-backend:${IMAGE_TAG:?Set IMAGE_TAG to a deployed commit}
  restart: unless-stopped
  init: true
  env_file:
    - path: backend.env
      format: raw
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 4000
    TMPDIR: /var/tmp/clipvelto
    YOUTUBE_PYTHON: /opt/media/bin/python
    TRANSCRIPTION_THREADS: 2
    OMP_NUM_THREADS: 2
    OPENBLAS_NUM_THREADS: 2
    MKL_NUM_THREADS: 2
  volumes:
    - media-temp:/var/tmp/clipvelto
    - ./youtube-session:/run/clipvelto-youtube:ro
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  networks: [app, data]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  mongo:
    image: mongo:8.2.2
    restart: unless-stopped
    env_file:
      - path: mongo.env
        format: raw
    entrypoint: ["/bin/bash", "/scripts/mongo-entrypoint.sh"]
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./mongo-entrypoint.sh:/scripts/mongo-entrypoint.sh:ro
      - ./mongo-init-user.js:/docker-entrypoint-initdb.d/01-clipvelto-user.js:ro
      - ./mongo-healthcheck.js:/scripts/mongo-healthcheck.js:ro
    networks: [data]
    mem_limit: 768m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "mongosh", "--nodb", "--quiet", "--file", "/scripts/mongo-healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  mongo-bootstrap:
    image: mongo:8.2.2
    restart: "no"
    env_file:
      - path: mongo.env
        format: raw
    entrypoint: ["mongosh", "--nodb", "--quiet", "--file", "/scripts/mongo-bootstrap.js"]
    volumes:
      - ./mongo-bootstrap.js:/scripts/mongo-bootstrap.js:ro
    depends_on:
      mongo: { condition: service_started }
    networks: [data]
    mem_limit: 256m
    cpus: 0.25

  redis:
    image: redis:7.4-bookworm
    restart: unless-stopped
    env_file:
      - path: redis.env
        format: raw
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --maxmemory 128mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    networks: [data]
    mem_limit: 192m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    <<: *app
    ports:
      - "127.0.0.1:4002:4000"
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      mongo-bootstrap: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    mem_limit: 2560m
    cpus: 1.5
    stop_grace_period: 160s
    depends_on:
      api: { condition: service_healthy }

  frontend:
    image: ghcr.io/mohammadjahid8/clipvelto-frontend:${IMAGE_TAG:?Set IMAGE_TAG to a deployed commit}
    restart: unless-stopped
    init: true
    env_file:
      - path: frontend.env
        format: raw
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:4000
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - frontend-cache:/app/front-end/.next/cache
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [app]
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  mongo-data:
  mongo-config:
  redis-data:
  media-temp:
  frontend-cache:

networks:
  app:
  data:
    internal: true
