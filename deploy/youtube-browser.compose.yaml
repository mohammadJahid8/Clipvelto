name: clipvelto-browser
services:
  session:
    image: ghcr.io/mohammadjahid8/clipvelto-youtube-browser:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    hostname: clipvelto-youtube-browser
    environment:
      HOME: /home/browser
      DISPLAY: ":99"
      PYTHONPATH: /opt/clipvelto-browser
    ports:
      - "127.0.0.1:6082:6080"
    volumes:
      - ./youtube-browser-profile:/home/browser/profile
      - ./youtube-session:/run/clipvelto-youtube
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /home/browser/.cache:uid=1000,gid=1000,size=128m,mode=700
      - /home/browser/.config:uid=1000,gid=1000,size=16m,mode=700
      - /home/browser/.local:uid=1000,gid=1000,size=16m,mode=700
      - /home/browser/.fluxbox:uid=1000,gid=1000,size=16m,mode=700
      - /home/browser/.pki:uid=1000,gid=1000,size=16m,mode=700
    shm_size: 256m
    mem_limit: 1280m
    cpus: 0.75
    pids_limit: 384
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./youtube-browser-seccomp.json
    healthcheck:
      test: ["CMD", "python", "control.py", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
